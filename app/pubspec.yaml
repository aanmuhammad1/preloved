name: preloved
description: "A new Flutter project."
# The following line prevents the package from accidentally being published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by a +.
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, CFBundleShortVersionString is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/Articles/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name and build-number are used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. See `flutter pub outdated` for more information.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints for
  # the project. The lint set is activated in the `analysis_options.yaml` file
  # located at the root of your package.
  # See that file for information about deactivating lint rules.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information about the generic Dart part of this file, see
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # Local Image Assets untuk produk Preloved.
  assets:
    - assets/images/products/

  # Custom font Poppins untuk aplikasi Preloved.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific variants.
  # For details regarding resolution-aware images, see:
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see:
  # https://flutter.dev/to/asset-from-package

  # For details regarding adding fonts from package dependencies:
  # https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/preloved_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8F8EE"
  adaptive_icon_foreground: "assets/icon/preloved_icon.png"
